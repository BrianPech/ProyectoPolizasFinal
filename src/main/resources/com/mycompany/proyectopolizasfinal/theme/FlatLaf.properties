#-------------------------------------------------------------------------------
# FlatLaf Custom Defaults - Reglas Generales (Comunes a Modo Claro y Oscuro)
# Basado en tema shadcn/ui (--radius: 0.625rem = 10px)
# Documentación: https://www.formdev.com/flatlaf/properties-files/
#-------------------------------------------------------------------------------

# Curvatura de esquinas derivada de --radius: 0.625rem de shadcn/ui
# En FlatLaf, 'arc' corresponde al diámetro del arco (arc = 2 * radio)
# Component/Card: radio 10px -> arc 20
# Botones/Inputs (rounded-md): radio 8px -> arc 16
# Sidebar Inset (rounded-xl de shadcn web): radio 12px -> arc 24
Component.arc = 20
Button.arc = 16
TextComponent.arc = 16
ProgressBar.arc = 16
SideBar.inset.arc = 24

# Tipografía moderna del proyecto (Inter es la fuente oficial de shadcn/ui, con Roboto y San Francisco de fallback)
defaultFont = Inter, Roboto, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif 13

# Ancho de foco (Ring de shadcn)
Component.focusWidth = 2
Component.innerFocusWidth = 0

# Gráficos / Charts compartidos (Tokens HSL/OKLCH)
Chart.1 = #8ec5ff
Chart.2 = #2b7fff
Chart.3 = #155dfc
Chart.4 = #1447e6
Chart.5 = #193cb8
