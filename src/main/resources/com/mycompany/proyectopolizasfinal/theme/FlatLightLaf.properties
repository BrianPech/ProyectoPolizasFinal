#-------------------------------------------------------------------------------
# FlatLaf Custom Defaults - Tema Claro (shadcn/ui :root)
# Conversión exacta desde OKLCH a sRGB Hex
# Documentación: https://www.formdev.com/flatlaf/customizing/
#-------------------------------------------------------------------------------

#---- Variables shadcn/ui :root ----
@background          = #ffffff
@foreground          = #0a0a0a
@card                = #ffffff
@cardForeground      = #0a0a0a
@popover             = #ffffff
@popoverForeground   = #0a0a0a
@primary             = #1447e6
@primaryForeground   = #eff6ff
@secondary           = #f4f4f5
@secondaryForeground = #18181b
@muted               = #f5f5f5
@mutedForeground     = #737373
@accent              = #f5f5f5
@accentForeground    = #171717
@destructive         = #e7000b
@border              = #e5e5e5
@input               = #e5e5e5
@ring                = #a1a1a1

#---- Variables Sidebar shadcn/ui ----
@sidebar                  = #fafafa
@sidebarForeground        = #0a0a0a
@sidebarPrimary           = #155dfc
@sidebarPrimaryForeground = #eff6ff
@sidebarAccent            = #f5f5f5
@sidebarAccentForeground   = #171717
@sidebarBorder            = #e5e5e5
@sidebarRing              = #a1a1a1

#---- FlatLaf Core Variables ----
@accentColor                = @primary
@selectionBackground        = @primary
@selectionForeground        = @primaryForeground
@disabledBackground         = @muted
@disabledForeground         = @mutedForeground

#---- Componentes Generales ----
Panel.background            = @background
Card.background             = @card
Card.foreground             = @cardForeground
Label.foreground            = @foreground
Component.borderColor       = @border
Component.focusColor        = @ring
Component.focusedBorderColor= @ring
Component.error.borderColor = @destructive
Component.error.focusedBorderColor = @destructive
Separator.foreground        = @border

#---- Botones ----
Button.background           = @secondary
Button.foreground           = @secondaryForeground
Button.borderColor          = @border
Button.default.background   = @primary
Button.default.foreground   = @primaryForeground
Button.default.borderColor  = @primary
Button.default.hoverBackground   = lighten(@primary, 6%)
Button.default.focusedBackground = darken(@primary, 4%)
Button.default.pressedBackground = darken(@primary, 8%)
Button.toolbar.hoverBackground   = @accent
Button.toolbar.hoverForeground   = @accentForeground
Button.toolbar.selectedBackground = @primary
Button.toolbar.selectedForeground = @primaryForeground
ToggleButton.toolbar.selectedBackground = @primary
ToggleButton.toolbar.selectedForeground = @primaryForeground

#---- Inputs y Textos ----
TextField.background        = @background
TextField.foreground        = @foreground
TextField.borderColor       = @input
TextField.focusedBorderColor= @ring
TextField.placeholderForeground = @mutedForeground
TextField.selectionBackground   = @primary
TextField.selectionForeground   = @primaryForeground
PasswordField.background    = $TextField.background
PasswordField.foreground    = $TextField.foreground
PasswordField.borderColor   = $TextField.borderColor
PasswordField.focusedBorderColor = $TextField.focusedBorderColor
PasswordField.placeholderForeground = $TextField.placeholderForeground
FormattedTextField.background = $TextField.background
FormattedTextField.foreground = $TextField.foreground
TextArea.background         = @background
TextArea.foreground         = @foreground

#---- Popovers / Menús / Tooltips ----
PopupMenu.background        = @popover
PopupMenu.borderColor       = @border
MenuItem.background         = @popover
MenuItem.foreground         = @popoverForeground
MenuItem.selectionBackground = @accent
MenuItem.selectionForeground = @accentForeground
ComboBox.background         = $TextField.background
ComboBox.foreground         = @foreground
ComboBox.borderColor        = @input
ComboBox.popupBackground    = @popover
ComboBox.selectionBackground= @accent
ComboBox.selectionForeground= @accentForeground
ToolTip.background          = @popover
ToolTip.foreground          = @popoverForeground
ToolTip.borderColor         = @border

#---- Tablas y Listas ----
Table.background            = @card
Table.foreground            = @cardForeground
Table.gridColor             = @border
Table.selectionBackground   = @primary
Table.selectionForeground   = @primaryForeground
TableHeader.background      = @muted
TableHeader.foreground      = @mutedForeground
TableHeader.separatorColor  = @border
List.background             = @background
List.foreground             = @foreground
List.selectionBackground    = @primary
List.selectionForeground    = @primaryForeground
ScrollPane.background       = @background
ScrollPane.borderColor      = @border

#---- Propiedades personalizadas para Sidebar ----
SideBar.background          = @sidebar
SideBar.foreground          = @sidebarForeground
SideBar.primary             = @sidebarPrimary
SideBar.primaryForeground   = @sidebarPrimaryForeground
SideBar.accent              = @sidebarAccent
SideBar.accentForeground    = @sidebarAccentForeground
SideBar.borderColor         = @sidebarBorder
SideBar.ring                = @sidebarRing
SideBar.button.foreground   = @mutedForeground
SideBar.button.selectedBackground = @sidebarPrimary
SideBar.button.selectedForeground = @sidebarPrimaryForeground
SideBar.button.hoverBackground = @sidebarAccent
SideBar.button.hoverForeground = @sidebarAccentForeground

#---- Sidebar Inset (shadcn variant="inset") ----
SideBar.inset.background    = @background
SideBar.inset.foreground    = @foreground
SideBar.inset.borderColor   = @sidebarBorder
SideBar.inset.arc           = 24

#---- UserProfile Avatar ----
UserProfile.background      = @accent
UserProfile.foreground      = @foreground
UserProfile.borderColor     = @sidebarPrimary
UserProfile.hoverBackground = @secondary
UserProfile.destructiveForeground = @destructive
